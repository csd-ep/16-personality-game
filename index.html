<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="以 16 條簡單選擇題探索你的四字母人格類型。">
  <title>人格航向｜16 型人格小測驗</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <section id="start-screen" class="screen start-screen" aria-labelledby="start-title">
      <div class="brand-mark" aria-hidden="true">16</div>
      <p class="eyebrow">PERSONALITY COMPASS</p>
      <h1 id="start-title">找出你的人格航向</h1>
      <p class="lead">憑直覺回答 16 條二選一問題，看看你在四個人格維度上的自然傾向。</p>
      <ul class="feature-list" aria-label="測驗資料">
        <li><strong>16</strong><span>條問題</span></li>
        <li><strong>4</strong><span>個維度</span></li>
        <li><strong>3</strong><span>分鐘完成</span></li>
      </ul>
      <button id="start-button" class="primary-button" type="button">開始測驗 <span aria-hidden="true">→</span></button>
      <p class="privacy-note">毋須登入。答案不會被收集、儲存或傳送。</p>
    </section>

    <section id="quiz-screen" class="screen quiz-screen" aria-labelledby="question-text" hidden>
      <header class="quiz-header">
        <button id="home-button" class="text-button" type="button" aria-label="返回開始頁">人格航向</button>
        <p id="question-counter" class="question-counter" aria-live="polite"></p>
      </header>
      <div class="progress-track" role="progressbar" aria-label="測驗進度" aria-valuemin="0" aria-valuemax="16" aria-valuenow="1">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <div class="question-card">
        <p class="question-kicker">哪一項較接近你？</p>
        <h2 id="question-text"></h2>
        <div id="answer-list" class="answer-list"></div>
      </div>
      <button id="back-button" class="back-button" type="button">← 上一題</button>
    </section>

    <section id="result-screen" class="screen result-screen" aria-labelledby="result-type" hidden>
      <p class="eyebrow">YOUR PERSONALITY TYPE</p>
      <p class="result-label">你的人格航向是</p>
      <h2 id="result-type" class="result-type" aria-live="polite"></h2>
      <h3 id="result-name" class="result-name"></h3>
      <p id="result-description" class="result-description"></p>
      <div id="dimension-results" class="dimension-results" aria-label="四個人格維度結果"></div>
      <button id="restart-button" class="primary-button" type="button">重新測驗</button>
      <p class="disclaimer">本測驗只供趣味探索，並非專業心理評估。</p>
    </section>
  </main>
</body>
</html>
